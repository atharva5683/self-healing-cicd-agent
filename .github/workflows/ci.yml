name: CI Pipeline with Self-Healing Agent

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        id: install
        run: |
          pip install -r sample-app/requirements.txt > install-output.txt 2>&1
        continue-on-error: true

      - name: Run lint check
        id: lint
        run: |
          pip install flake8
          cd sample-app
          flake8 . > ../lint-output.txt 2>&1
        continue-on-error: true

      - name: Run tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          pip install pytest
          cd sample-app
          pytest tests/ -v > "$GITHUB_WORKSPACE/test-output.txt" 2>&1

      - name: Build Docker image
        id: docker
        run: |
          docker build -t self-healing-demo ./sample-app > docker-output.txt 2>&1
        continue-on-error: true

      - name: Combine all logs
        if: always()
        run: |
          echo "PIPELINE STEP STATUS" > combined-logs.txt
          echo "INSTALL_STATUS=${{ steps.install.outcome }}" >> combined-logs.txt
          echo "LINT_STATUS=${{ steps.lint.outcome }}" >> combined-logs.txt
          echo "TEST_STATUS=${{ steps.tests.outcome }}" >> combined-logs.txt
          echo "DOCKER_STATUS=${{ steps.docker.outcome }}" >> combined-logs.txt

          echo "" >> combined-logs.txt
          echo "===== INSTALL LOGS =====" >> combined-logs.txt
          cat install-output.txt >> combined-logs.txt 2>/dev/null || echo "No install logs" >> combined-logs.txt

          echo "" >> combined-logs.txt
          echo "===== LINT LOGS =====" >> combined-logs.txt
          cat lint-output.txt >> combined-logs.txt 2>/dev/null || echo "No lint logs" >> combined-logs.txt

          echo "" >> combined-logs.txt
          echo "===== TEST LOGS =====" >> combined-logs.txt
          cat "$GITHUB_WORKSPACE/test-output.txt" >> combined-logs.txt 2>/dev/null || echo "No test logs found" >> combined-logs.txt

          echo "" >> combined-logs.txt
          echo "===== DOCKER LOGS =====" >> combined-logs.txt
          cat docker-output.txt >> combined-logs.txt 2>/dev/null || echo "No docker logs" >> combined-logs.txt

      - name: Debug log files
        if: always()
        run: |
          echo "Files in workspace:"
          ls -la
          echo "Test output:"
          cat test-output.txt || echo "test-output.txt missing"

      - name: Upload combined logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-logs
          path: combined-logs.txt

      - name: Fail build if any critical step failed
        if: always()
        run: |
          if [ "${{ steps.install.outcome }}" = "failure" ] || \
             [ "${{ steps.lint.outcome }}" = "failure" ] || \
             [ "${{ steps.tests.outcome }}" = "failure" ] || \
             [ "${{ steps.docker.outcome }}" = "failure" ]; then
            echo "One or more build steps failed"
            exit 1
          else
            echo "All build steps passed"
          fi

  self-healing-agent:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install agent dependencies
        run: |
          pip install anthropic requests

      - name: Download pipeline logs
        uses: actions/download-artifact@v4
        with:
          name: combined-logs
        continue-on-error: true

      - name: Run Self-Healing Agent
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python agent/self_healing_agent.py
